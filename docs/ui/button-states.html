@layer reader-base {
:root {
  color: var(--ink);
  background: var(--panel);
  --interface-font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-family: var(--interface-font);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  /* Semantic color tokens (2.0a, user-reviewed 2026-10-21). Components read these; dark values arrive with color-scheme switching. */
  --paper: #fbfbf8;
  --panel: #f4f4f3;
  --soft: #ededec;
  --line: #e1e1de;
  --line-strong: #d0d0cc;
  --ink: #17181b;
  --text: #303034;
  --reading-ink: #232429;
  --muted: #626874;
  /* Icons, placeholders and dividers only: below 4.5:1, never body text. */
  --subtle: #8b909b;
  --accent: #5058d4;
  --accent-strong: #4148bb;
  --accent-muted: #a6a1ed;
  --accent-soft: #edf0ff;
  --accent-line: #ced5ff;
  --accent-press: #b8c2fa;
  --mark: #dcdcf8;
  --intent-violet: #6d42b7;
  --success: #1f7a4d;
  --success-soft: #eaf6ef;
  --warning: #9b6417;
  --warning-soft: #fff5df;
  --warning-line: #f0d6a1;
  --danger: #b44747;
  --danger-soft: #fff0f0;
  --danger-line: #eec4c7;
  --on-accent: #ffffff;
  /* Disabled text keeps its own neutral so it never reads as ordinary muted text. */
  --disabled-fg: #6b7280;
  /* Older names stay as aliases so untouched rules keep working. */
  --muted-2: var(--muted);
  --blue: var(--accent);
  --blue-strong: var(--accent-strong);
  --blue-soft: var(--accent-soft);
  --blue-line: var(--accent-line);
  --green: var(--success);
  --green-soft: var(--success-soft);
  --amber: var(--warning);
  --amber-soft: var(--warning-soft);
  --red: var(--danger);
  /* Interface type scale B; reading body text keeps its own spec (18px / 17px). */
  --font-meta: 12px;
  --font-ui: 13px;
  --font-ui-strong: 14px;
  --font-body: 14px;
  --font-answer: 16px;
  --line-answer: 1.75;
  --shadow-float: 0 18px 50px rgba(20, 24, 36, 0.14), 0 2px 8px rgba(20, 24, 36, 0.08);
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: clip;
  background-color: var(--panel);
}

button,
input,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
a:focus-visible {
  outline: 2px solid rgba(83, 109, 254, 0.45);
  outline-offset: 2px;
}

.app-frame {
  position: relative;
  display: grid;
  --left-open-width: 236px;
  --left-width: var(--left-open-width);
  --right-width: 360px;
  grid-template-columns: var(--left-width) minmax(0, 1fr) var(--right-width);
  width: 100%;
  height: 100dvh;
  grid-template-rows: minmax(0, 1fr);
  margin: 0;
  overflow: clip;
  background: var(--paper);
  border: 0;
  box-shadow: none;
}

.left-sidebar,
.right-panel,
.reader-column {
  min-width: 0;
  min-height: 0;
}

.left-sidebar {
  position: relative;
  z-index: 20;
  display: flex;
  flex-direction: column;
  overflow: clip;
  background: transparent;
  border-right: 0;
}

.left-sidebar-inner {
  position: absolute;
  inset: 0 0 0 auto;
  display: flex;
  flex-direction: column;
  width: var(--left-open-width);
  min-width: 0;
  min-height: 0;
  background: var(--reading-desk);
  border-right: 1px solid var(--reading-line);
}

.right-panel-inner {
  position: absolute;
  inset: 0 auto 0 0;
  display: flex;
  flex-direction: column;
  width: var(--right-open-width, var(--right-width));
  min-width: 0;
  min-height: 0;
  background: var(--reading-paper);
  border-left: 1px solid var(--reading-line);
  container: knowledge-panel / inline-size;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 64px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}

.brand-row > div {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.brand-row strong {
  font-size: var(--font-ui-strong);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.brand-mark {
  display: block;
  flex: 0 0 auto;
  width: 29px;
  height: 29px;
  object-fit: contain;
  transform: translateY(1px);
}

.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  cursor: pointer;
}

.icon-button:hover {

  background: var(--soft);
}

.sidebar-close {

  margin-left: auto;
}

.import-card {
  display: grid;
  grid-template-columns: 31px 1fr 16px;
  align-items: center;
  gap: 9px;
  margin: 14px 12px 10px;
  padding: 10px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);

}

.import-card:hover {
  border-color: var(--accent-line);
  background: var(--soft);
}

.import-card > span:nth-child(2) {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.import-card strong {
  font-size: var(--font-ui);
  font-weight: 650;
}

.import-card small {
  overflow: hidden;
  color: var(--muted-2);
  font-size: var(--font-ui);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.import-card > svg {
  color: var(--muted-2);
}

.import-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 31px;
  height: 31px;
  color: var(--blue);
  border-radius: 9px;
  background: var(--blue-soft);
}

.sidebar-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 0 8px 18px;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

.nav-section + .nav-section {
  margin-top: 19px;
  padding-top: 15px;
  border-top: 1px solid var(--line);
}

.section-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 7px;
  color: var(--muted);
  font-size: var(--font-ui);
  font-weight: 650;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.section-label span:last-child {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper);
}

.outline-list {
  display: grid;
  gap: 2px;
}

.outline-item {
  overflow: hidden;
  width: 100%;
  padding: 9px 10px;
  color: var(--muted);
  font-size: var(--font-ui);
  line-height: 1.35;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
  border: 0;
  border-radius: 7px;
  background: transparent;
  cursor: pointer;
}

.outline-item:hover {
  color: var(--ink);
  background: var(--soft);
}

.outline-item.level-1 {
  color: var(--reading-ink);
  font-weight: 650;
}

.outline-item.level-2 {
  padding-left: 14px;
}

.outline-item.level-3,
.outline-item.level-4,
.outline-item.level-5,
.outline-item.level-6 {
  padding-left: 23px;
  color: var(--muted);
}

.connection-dot.connected {
  background: var(--blue);
  box-shadow: 0 0 0 3px rgba(83, 109, 254, 0.1);
}

.nav-empty {
  margin: 4px 8px;
  color: var(--muted-2);
  font-size: var(--font-ui);
  line-height: 1.6;
}

.reader-column {
  display: flex;
  flex-direction: column;
  background: var(--paper);
}

.reader-toolbar {
  position: relative;
  /* Provider popover must clear the status toolbar (16), below drawers (80+). */
  z-index: 17;
  display: flex;
  flex: 0 0 64px;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(14px);
}

.toolbar-title {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.toolbar-title > svg {
  flex: 0 0 auto;
  color: var(--muted);
}

.toolbar-title > div {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.toolbar-title strong {
  overflow: hidden;
  max-width: 320px;
  font-size: var(--font-ui);
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.toolbar-title span {
  color: var(--muted);
  font-size: var(--font-ui);
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 5px;
}

.toolbar-button,
.provider-trigger {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 10px;
  font-size: var(--font-ui);
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper);
  cursor: pointer;
}

.toolbar-button:hover,
.provider-trigger:hover {
  border-color: var(--line-strong);
  background: var(--panel);
}

.provider-control {
  position: relative;
}

.provider-trigger > svg:first-child {
  color: var(--blue);
}

.connection-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--line-strong);
}

.connection-dot.unavailable {
  background: var(--warning);
}

.connection-dot.checking {
  background: var(--subtle);

}

.provider-popover {
  position: absolute;
  top: 40px;
  right: 0;
  z-index: 60;
  width: 340px;
  padding: 8px;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  background: var(--paper);
  box-shadow: var(--shadow-float);
}

.popover-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 6px 9px 8px;
}

.popover-head > div {
  display: grid;
  gap: 2px;
}

.popover-head strong {
  font-size: var(--font-ui);
}

.popover-head span {
  color: var(--muted-2);
  font-size: var(--font-ui);
}

.provider-list {
  display: grid;
  gap: 3px;
}

.provider-option {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 52px;
  padding: 8px;
  text-align: left;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
}

.provider-option:hover {
  background: var(--panel);
}

.provider-option.active {
  border-color: var(--accent-line);
  background: var(--accent-soft);
}

.provider-option-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
}

.provider-option.active .provider-option-icon {
  color: var(--blue);
  border-color: var(--blue-line);
}

.provider-option-copy {
  display: grid;
  gap: 3px;
  min-width: 0;
}

.provider-option-copy strong {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: var(--font-ui);
}

.provider-option-copy em {
  padding: 2px 4px;
  color: var(--muted);
  font-size: var(--font-meta);
  font-style: normal;
  font-weight: 600;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
}

.provider-option-copy small {
  overflow: hidden;
  color: var(--muted-2);
  font-size: var(--font-ui);
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.availability-label {
  color: var(--muted-2);
  font-size: var(--font-ui);
}

.availability-label.connected {
  color: var(--green);
}

.reader-scroll {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
  scroll-behavior: smooth;
}

.demo-document-note {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 760px;
  margin: 24px auto 0;
  padding: 9px 12px;
  color: var(--muted);
  font-size: var(--font-ui);
  border: 1px solid var(--accent-line);
  border-radius: 9px;
  background: var(--paper);
}

.demo-document-note > svg {
  flex: 0 0 auto;
  color: var(--blue);
}

.demo-document-note span {
  flex: 1;
}

.demo-document-note button {
  padding: 0;
  color: var(--blue-strong);
  font-size: var(--font-ui);
  font-weight: 600;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.markdown-article {
  width: min(100%, 800px);
  margin: 0 auto;
  padding: 40px 40px 80px;
  color: var(--reading-ink);
  font-family: var(--reading-font);
  font-size: 16px;
  line-height: 1.85;
}

.markdown-article > :first-child {
  margin-top: 0;
}

.markdown-article h1,
.markdown-article h2,
.markdown-article h3,
.markdown-article h4 {
  color: var(--ink);
  line-height: 1.28;
  letter-spacing: -0.025em;
  scroll-margin-top: 86px;
}

.markdown-article h1 {
  margin: 0 0 32px;
  font-size: clamp(28px, 2.4vw, 36px);
  font-weight: 720;
}

.markdown-article h2 {
  margin: 40px 0 16px;
  padding-top: 4px;
  font-size: 24px;
  font-weight: 690;
}



.markdown-article h3 {
  margin: 38px 0 13px;
  font-size: 19px;
  font-weight: 680;
}

.markdown-article h4 {
  margin: 28px 0 10px;
  font-size: 16px;
}

.markdown-article p {
  margin: 0 0 18px;
}

.markdown-article strong {
  color: var(--ink);
  font-weight: 690;
}

.markdown-article a {
  color: var(--blue-strong);
  text-decoration-color: var(--accent-press);
  text-underline-offset: 3px;
}

.markdown-article blockquote {
  margin: 25px 0;
  padding: 16px 18px;
  color: var(--muted);
  border: 0;
  border-left: 3px solid var(--line-strong);
  border-radius: 0;
  background: var(--panel);
}

.markdown-article blockquote p:last-child {
  margin-bottom: 0;
}

.markdown-article ul,
.markdown-article ol {
  margin: 16px 0 23px;
  padding-left: 1.45em;
}

.markdown-article li {
  margin: 7px 0;
  padding-left: 0.25em;
}

.markdown-article li::marker {
  color: var(--subtle);
  font-weight: 600;
}

.markdown-article table {
  width: 100%;
  margin: 25px 0 32px;
  overflow: hidden;
  font-size: var(--font-body);
  line-height: 1.65;
  border-collapse: separate;
  border-spacing: 0;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
}

.markdown-article th,
.markdown-article td {
  padding: 11px 13px;
  text-align: left;
  vertical-align: top;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.markdown-article th:last-child,
.markdown-article td:last-child {
  border-right: 0;
}

.markdown-article tr:last-child td {
  border-bottom: 0;
}

.markdown-article th {
  color: var(--muted);
  font-size: var(--font-ui);
  font-weight: 650;
  letter-spacing: 0.02em;
  background: var(--panel);
}

.markdown-article pre {
  margin: 22px 0;
  padding: 15px 17px;
  overflow: auto;
  color: inherit;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 1em;
  line-height: 1.7;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
}

.markdown-article code {
  padding: 2px 5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.86em;
  border-radius: 4px;
  background: var(--soft);
}

.markdown-article pre code {
  padding: 0;
  font-size: inherit;
  line-height: inherit;
  background: transparent;
}

.markdown-article img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 24px auto;
  border-radius: 10px;
}

/* Keep ink and geometry stable; cloned dashed edges identify each line fragment. */
:is(.markdown-article,.start-demo-source) mark[data-focus-stickies-highlight] {
  margin: 0 -1px;
  padding: 0 0 1px;
  border: 1px dashed transparent;
  color: inherit;
  border-radius: 3px 2px 4px 2px;
  background-color: #e4e3f9;
  background-image:
    /* Marker-pen ends are hand-tuned; they get their own dark values with color-scheme switching. */
    linear-gradient(to right, #c0bee9, #c6c3ec 15.4%, #d0cef1 46.2%, #e4e3f9),
    linear-gradient(to left, #bebbe7, #c3c0ea 16.7%, #d0cef1 50%, #e4e3f9);
  background-size: min(13px, 30%) 100%, min(12px, 30%) 100%;
  background-origin: border-box;
  background-position: left center, right center;
  background-repeat: no-repeat;
  box-shadow: none;
  cursor: pointer;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
:is(.markdown-article,.start-demo-source) mark[data-focus-stickies-highlight]:hover {
  border-color: var(--accent-muted);
}
:is(.markdown-article,.start-demo-source) mark[data-focus-stickies-highlight].is-emphasized {
  border-color: var(--accent);
}

.reader-footer {

  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 75px;

  font-size: var(--font-ui);
  border-top: 1px solid var(--line);
}

.right-panel {

  z-index: 16;

  background: transparent;
  border-left: 0;
}

.panel-mobile-head {

}

.empty-panel {

  flex-direction: column;
  align-items: center;
  height: 100%;
  padding: 86px 42px 30px;
  overflow: auto;
}

.empty-visual {

  width: 116px;
  height: 116px;
  margin-bottom: 32px;
}

.focus-ring,
.focus-center {

  left: 50%;

}

.ring-one {

.ring-two {

}

.focus-center {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;

}

.empty-copy {

}

.eyebrow {

.empty-copy h2 {

}

.empty-copy p {

.onboarding-steps {

}

.onboarding-steps li {

.onboarding-steps li > span {

  background: var(--paper);
}

.onboarding-steps li > div {

  gap: 2px;
}

.onboarding-steps strong {

  font-weight: 650;
}

.onboarding-steps small {
  color: var(--muted-2);
  font-size: var(--font-ui);
}

.current-provider-card {
  display: grid;
  grid-template-columns: 34px 1fr 7px;
  gap: 10px;
  align-items: center;
  width: 100%;
  max-width: 300px;
  margin-top: auto;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 11px;

}

.current-provider-card > div {
  display: grid;

}

.current-provider-card small {

  font-size: var(--font-ui);
}

.current-provider-card strong {
  font-size: var(--font-ui);
}

.inquiry-panel-content {

}

.inquiry-head {

.inquiry-kind {

.intent-icon {

.inquiry-kind > div {

.inquiry-kind strong {

.status-badge {

.thread-scroll {

.anchor-card blockquote {

}

.assistant-message > header small {
  color: var(--muted-2);
  font-size: var(--font-meta);
}

.evidence-badge {
  padding: 4px 6px;
  font-size: var(--font-meta);
  font-weight: 600;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
}

.evidence-supported {
  color: var(--green);
  border-color: var(--line);
  background: var(--green-soft);
}

.evidence-partial,
.evidence-unsupported {
  color: var(--amber);
  border-color: var(--line);
  background: var(--amber-soft);
}

.evidence-neutral {
  color: var(--muted);
}

.demo-answer-label {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: -2px 0 10px;
  padding: 6px 7px;
  color: var(--warning);
  font-size: var(--font-ui);
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--warning-soft);
}

.answer-markdown {
  color: var(--text);
  font-family: var(--reading-font);
  font-size: var(--font-ui);
  line-height: 1.72;
}

.answer-markdown > :first-child {
  margin-top: 0;
}

.answer-markdown > :last-child {
  margin-bottom: 0;
}

.answer-markdown h1,
.answer-markdown h2,
.answer-markdown h3 {
  margin: 16px 0 7px;
  color: var(--ink);
  font-size: var(--font-ui);
}

.answer-markdown p {
  margin: 0 0 10px;
}

.answer-markdown ul,
.answer-markdown ol {
  margin: 7px 0 10px;
  padding-left: 18px;
}

.answer-markdown li {
  margin: 4px 0;
}

.answer-markdown strong {
  color: var(--reading-ink);
  font-weight: 680;
}

.answer-markdown code {
  padding: 1px 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: var(--font-ui);
  border-radius: 4px;
  background: var(--soft);
}

.answer-markdown pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.source-section {
  display: grid;
  gap: 7px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.source-heading {
  display: flex;
  justify-content: space-between;
  color: var(--muted-2);
  font-size: var(--font-ui);
  font-weight: 650;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.source-card {
  display: grid;
  grid-template-columns: 25px 1fr 13px;
  gap: 8px;
  align-items: start;
  padding: 8px;
  color: inherit;
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper);
}

.source-card:hover {
  border-color: var(--accent-line);
  background: var(--paper);
}

.source-favicon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 25px;
  height: 25px;
  color: var(--muted);
  font-size: var(--font-ui);
  font-weight: 700;
  border: 1px solid var(--accent-line);
  border-radius: 7px;
  background: var(--paper);
}

.source-card > span:nth-child(2) {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.source-card strong {
  overflow: hidden;
  font-size: var(--font-ui);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.source-card small {
  color: var(--muted-2);
  font-size: var(--font-meta);
}

.source-card p {
  display: -webkit-box;
  margin: 4px 0 0;
  overflow: hidden;
  color: var(--muted);
  font-size: var(--font-ui);
  line-height: 1.4;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.source-card > svg {
  color: var(--muted-2);
}

.no-source-note {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding-top: 10px;
  color: var(--amber);
  font-size: var(--font-ui);
  border-top: 1px solid var(--line);
}

.thinking-card {
  display: grid;
  grid-template-columns: 29px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 12px;
  border: 1px solid var(--accent-line);
  border-radius: 11px;
  background: var(--panel);
}

.thinking-card > div {
  display: grid;
  gap: 2px;
}

.thinking-card strong {
  font-size: var(--font-ui);
  font-weight: 600;
}

.thinking-card small,
.thinking-card time {
  color: var(--muted-2);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: var(--font-meta);
  font-style: normal;
}

.pixel-loader {
  display: grid;
  grid-template-columns: repeat(3, 3px);
  grid-template-rows: repeat(3, 3px);
  gap: 2px;
  place-content: center;
  width: 29px;
  height: 29px;
}

.pixel-loader i {
  width: 3px;
  height: 3px;
  border-radius: 1px;
  background: var(--subtle);
  animation: pixel-wave 1.2s ease-in-out infinite;
}

.pixel-loader i:nth-child(2),
.pixel-loader i:nth-child(4) { animation-delay: 0.12s; }
.pixel-loader i:nth-child(3),
.pixel-loader i:nth-child(5),
.pixel-loader i:nth-child(7) { animation-delay: 0.24s; }
.pixel-loader i:nth-child(6),
.pixel-loader i:nth-child(8) { animation-delay: 0.36s; }
.pixel-loader i:nth-child(9) { animation-delay: 0.48s; }

.error-card {
  display: grid;
  grid-template-columns: 17px 1fr auto;
  gap: 8px;
  align-items: start;
  padding: 11px;
  color: var(--danger);
  border: 1px solid var(--danger-line);
  border-radius: 10px;
  background: var(--danger-soft);
}

.error-card > div {
  display: grid;
  gap: 3px;
}

.error-card strong {
  font-size: var(--font-ui);
}

.error-card p {
  margin: 0;
  font-size: var(--font-ui);
  line-height: 1.4;
}

.error-card button {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 6px;
  color: inherit;
  font-size: var(--font-ui);
  border: 1px solid var(--danger-line);
  border-radius: 6px;
  background: var(--paper);
  cursor: pointer;
}

.understanding-card {
  margin-top: 16px;
  padding: 13px;
  border: 1px solid var(--accent-line);
  border-radius: 12px;
  background: var(--paper);
}

.understanding-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  color: var(--muted-2);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: var(--font-meta);
}

.step-number {
  color: var(--blue);
  font-family: inherit;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.understanding-card label {
  display: block;
  margin-bottom: 7px;
  font-size: var(--font-ui);
  font-weight: 650;
}

.understanding-card textarea {
  width: 100%;
  min-height: 82px;
  padding: 9px 10px;
  resize: vertical;
  color: var(--text);
  font-size: var(--font-ui);
  line-height: 1.6;
  border: 1px solid var(--accent-line);
  border-radius: 9px;
  outline: 0;
  background: var(--paper);
}

.understanding-card textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(83, 109, 254, 0.08);
}

.understanding-card textarea::placeholder {
  color: var(--subtle);
}

.understanding-card p {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  margin: 7px 0 0;
  color: var(--muted-2);
  font-size: var(--font-meta);
  line-height: 1.45;
}

.inquiry-actions {
  flex: 0 0 auto;
  padding: 11px 13px 13px;
  border-top: 0;
  background: transparent;
}

.followup-composer {
  display: grid;
  grid-template-columns: 1fr 28px;
  gap: 6px;
  align-items: end;
  padding: 6px 6px 6px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: var(--paper);
}

.followup-composer:focus-within {
  border-color: var(--accent-press);
  box-shadow: 0 0 0 3px rgba(83, 109, 254, 0.07);
}

.followup-composer textarea {
  width: 100%;
  height: 30px;
  max-height: 80px;
  padding: 6px 0;
  resize: none;
  font-size: var(--font-ui);
  line-height: 1.5;
  border: 0;
  outline: 0;
  background: transparent;
}

.followup-composer textarea::placeholder {
  color: var(--subtle);
}

.followup-composer > button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  color: #fff;
  border: 0;
  border-radius: 8px;
  background: var(--reading-ink);
  cursor: pointer;
}

.followup-composer > button:disabled {
  color: var(--line-strong);
  background: var(--soft);
  cursor: default;
}

.closure-actions {
  display: grid;
  grid-template-columns: auto auto 1fr;
  gap: 6px;
  margin-top: 8px;
}

.secondary-action,
.primary-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 31px;
  padding: 0 9px;
  font-size: var(--font-ui);
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
}

.secondary-action {
  color: var(--muted);
  border: 1px solid var(--line-strong);
  background: var(--paper);
}

.secondary-action:hover {
  background: var(--panel);
}

.secondary-action.full {
  width: 100%;
}

.primary-action {
  color: #fff;
  border: 1px solid var(--blue-strong);
  background: var(--blue);
}

.primary-action:hover {
  background: var(--blue-strong);
}

.selection-layer {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 100;
  width: 0;
  height: 0;
  pointer-events: none;
}

.selection-layer > .selection-toolbar {
  position: absolute;
  pointer-events: auto;
}

.selection-toolbar {
  position: fixed;
  z-index: 100;
  width: min(470px, calc(100vw - 24px));
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--paper);
  box-shadow: var(--shadow-float);
  transform: translateX(-50%);
  animation: pop-in 130ms ease-out;
}

.selection-quote {
  overflow: hidden;
  padding: 8px 11px 7px;
  color: var(--muted);
  font-size: var(--font-ui);
  text-overflow: ellipsis;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}

.selection-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr) 29px;
  gap: 3px;
  padding: 5px;
}

.selection-actions button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 31px;
  padding: 0 7px;
  font-size: var(--font-ui);
  font-weight: 600;
  border: 0;
  border-radius: 7px;
  background: transparent;
  cursor: pointer;
}

.selection-actions button:hover {
  color: var(--blue-strong);
  background: var(--blue-soft);
}

.selection-actions .selection-close {
  padding: 0;
  color: var(--muted-2);
}

.drop-overlay {
  position: absolute;
  z-index: 150;
  inset: 10px;
  display: grid;
  place-items: center;
  border: 2px dashed var(--accent-muted);
  border-radius: 18px;
  background: rgba(247, 248, 255, 0.92);
  backdrop-filter: blur(10px);
  pointer-events: none;
}

.drop-overlay > div {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 30px;
  color: var(--blue);
  border-radius: 16px;
  background: var(--paper);
  box-shadow: 0 18px 50px rgba(48, 61, 127, 0.12);
}

.drop-overlay strong {
  color: var(--ink);
  font-size: var(--font-body);
}

.drop-overlay span {
  color: var(--muted);
  font-size: var(--font-ui);
}

.toast {
  position: fixed;
  z-index: 200;
  bottom: 20px;
  left: 50%;
  max-width: min(440px, calc(100vw - 28px));
  padding: 10px 14px;
  color: #fff;
  font-size: var(--font-ui);
  line-height: 1.45;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9px;
  background: rgba(28, 29, 33, 0.94);
  box-shadow: 0 10px 35px rgba(19, 20, 25, 0.22);
  transform: translateX(-50%);
  animation: toast-in 160ms ease-out;
}

.drawer-navigation-trigger,
.drawer-results-trigger,
.mobile-scrim {
  display: none;
}

.spin {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes orbit {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

@keyframes pulse {
  50% { opacity: 0.35; }
}

@keyframes pixel-wave {
  0%, 100% { opacity: 0.25; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1); }
}

@keyframes pop-in {
  from { opacity: 0; transform: translateX(-50%) translateY(-4px) scale(0.985); }
}

@keyframes toast-in {
  from { opacity: 0; transform: translateX(-50%) translateY(6px); }
}

@media (max-width: 1260px) {
  .app-frame {
    --left-open-width: 216px;
    --right-width: 396px;
  }

  .markdown-article {
    padding-inline: 32px;
  }

  .toolbar-title strong {
    max-width: 220px;
  }
}

@media (max-width: 1080px) {
  .app-frame {
    --right-width: 396px;
    grid-template-columns: minmax(0, 1fr) var(--right-width);
  }

  .left-sidebar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 90;
    width: 242px;
    border-right-color: var(--line-strong);
    box-shadow: 14px 0 42px rgba(31, 34, 43, 0.12);
    transform: translateX(-104%);
    transition: transform 180ms ease;
  }

  .left-sidebar-inner {
    position: static;
    width: 100%;
    height: 100%;
  }

  .sidebar-open .left-sidebar {
    transform: translateX(0);
  }

  .sidebar-close,
  .drawer-navigation-trigger {
    display: inline-flex;
  }

  .mobile-scrim {
    position: absolute;
    z-index: 80;
    inset: 0;
    display: block;
    border: 0;
    background: rgba(25, 27, 33, 0.18);
    backdrop-filter: blur(1px);
  }
}

@media (max-width: 780px) {
  .drawer-results-trigger { display: inline-flex; }

  .app-frame {
    display: block;
    border: 0;
  }

  .reader-column {
    width: 100%;
    height: 100%;
  }

  .right-panel {
    position: absolute;
    z-index: 100;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(420px, 94vw);
    border-left-color: var(--line-strong);
    box-shadow: -14px 0 42px rgba(31, 34, 43, 0.12);
    transform: translateX(104%);
    transition: transform 180ms ease;
  }

  .right-panel-inner {
    position: static;
    width: 100%;
    height: auto;
    min-height: 100%;
  }

  .panel-open .right-panel {
    transform: translateX(0);
  }

  .panel-mobile-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 43px;
    padding: 0 13px;
    color: var(--muted);
    font-size: var(--font-ui);
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }

  .inquiry-panel-content,
  .empty-panel {
    height: calc(100% - 43px);
  }

  .reader-toolbar {
    padding-inline: 11px;
  }

  .toolbar-title > svg {
    display: none;
  }

  .toolbar-button span {
    display: none;
  }

  .toolbar-button {
    width: 32px;
    padding: 0;
    justify-content: center;
  }

  .markdown-article {
    width: min(100%, 720px);
    padding-inline: 32px;
  }

  .demo-document-note {
    margin-inline: 20px;
  }
}

@media (max-width: 560px) {
  .reader-toolbar {
    min-height: 57px;
    flex-basis: 57px;
  }

  .toolbar-title strong {
    max-width: 145px;
  }

  .toolbar-title span,
  .provider-trigger > span:first-of-type,
  .provider-trigger > svg:last-child {
    display: none;
  }

  .provider-trigger {
    width: 32px;
    padding: 0;
    justify-content: center;
  }

  .provider-trigger .connection-dot {
    position: absolute;
    top: 6px;
    right: 5px;
    width: 5px;
    height: 5px;
  }

  .provider-popover {
    position: fixed;
    top: 64px;
    right: 8px;
    left: 8px;
    width: auto;
  }

  .demo-document-note {
    align-items: flex-start;
    margin: 15px 12px 0;
    line-height: 1.45;
  }

  .demo-document-note button {
    display: none;
  }

  .markdown-article {
    padding: 36px 21px 75px;
    font-size: var(--font-body);
    line-height: 1.84;
  }

  .markdown-article h1 {
    font-size: 30px;
  }

  .markdown-article h2 {
    margin-top: 49px;
    font-size: 22px;
  }

  .markdown-article table {
    display: block;
    overflow-x: auto;
    white-space: normal;
  }

  .selection-toolbar {
    right: 8px;
    bottom: 10px;
    left: 8px !important;
    top: auto !important;
    width: auto;
    transform: none;
  }

  .selection-actions {
    grid-template-columns: repeat(2, 1fr) 29px;
  }

  .selection-actions .selection-close {
    grid-column: 3;
    grid-row: 1 / span 2;
    height: 100%;
  }

  .closure-actions {
    grid-template-columns: 1fr 1fr;
  }

  .primary-action {
    grid-column: 1 / -1;
  }

  .empty-panel {
    padding-top: 55px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Guided closure: fixed choices keep attention on the current anchor. */
.guided-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.guided-actions button { min-height: 38px; font-size: var(--font-ui); }
.guided-actions .primary-action { grid-column: auto; }
.guided-actions button:disabled { opacity: .45; cursor: not-allowed; }
.guided-hint { margin: 0 0 10px; color: var(--muted); font-size: var(--font-ui); }
.completion-note { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--font-ui); }

/* Evidence remains readable inside the existing narrow discussion panel. */
.verification-status-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 12px; }
.verification-status-row .evidence-badge { padding: 3px 8px; font-size: var(--font-ui-strong); line-height: 1.75; }
.search-trace { color: var(--muted); font-size: var(--font-ui-strong); line-height: 1.75; }
.search-trace small { display: inline; margin-left: 8px; font-size: inherit; }
.recheck-unavailable { color: var(--muted); font-size: var(--font-ui-strong); line-height: 1.5; margin: 8px 0 0; }
.source-evidence-card { min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 8px; background: var(--paper); }
.source-evidence-heading { display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.source-evidence-heading strong { font-size: var(--font-ui-strong); line-height: 1.5; }
.source-evidence-heading small, .source-details { color: var(--muted); font-size: var(--font-ui); }
.source-url { display: block; margin: 7px 0 10px; color: var(--accent); overflow-wrap: anywhere; font-size: var(--font-ui); line-height: 1.6; }
.excerpt-label { font-size: var(--font-ui); color: var(--warning); background: var(--warning-soft); border-radius: 4px; padding: 3px 6px; }
.excerpt-label.verified { color: var(--success); background: var(--success-soft); }
.source-evidence-card blockquote { margin: 10px 0; padding: 0 0 0 10px; border-left: 2px solid var(--line-strong); color: var(--text); font-size: var(--font-ui); line-height: 1.8; overflow-wrap: anywhere; user-select: text; }
.source-relation { font-size: var(--font-ui); margin: 7px 0; color: var(--muted); }
.source-details { display: block; margin: 5px 0; }
.source-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.source-actions a, .source-actions button { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 3px 0; color: var(--accent); font: inherit; font-size: var(--font-ui); cursor: pointer; text-decoration: none; }
.source-actions a:hover, .source-actions button:hover { text-decoration: underline; }
.source-actions a:focus-visible, .source-actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.source-location-help { display: block; margin-top: 8px; color: var(--subtle); font-size: var(--font-ui); line-height: 1.6; }
.copy-feedback { color: var(--muted); font-size: var(--font-ui); }

.verification-summary { padding: 4px 0 12px; overflow-wrap: anywhere; }
.verification-summary h4 { font-size: var(--font-ui); margin: 16px 0 5px; color: var(--text-muted, var(--muted)); }
.verification-summary p { font-size: var(--font-ui-strong); line-height: 1.75; margin: 4px 0; }
.verification-summary small { color: var(--muted); }
.verification-brief { padding: 0; }
.verification-brief .verification-conclusion { font-size: var(--font-answer); font-weight: 650; line-height: 1.65; margin: 0 0 8px; color: var(--ink); }
.verification-brief .verification-limitation { font-size: var(--font-answer); color: var(--muted); line-height: 1.75; margin: 0; }
.compact-sources { margin-top: 16px; padding-top: 12px; }

.right-panel { display: flex; flex-direction: column; }

/* Result-first sidebar: secondary controls never reserve reading height. */
.inquiry-tabs { padding: 10px 14px 4px; gap: 4px; }
.inquiry-tabs button { padding: 9px 5px; min-height: 0; }
.inquiry-tabs button small { font-size: var(--font-ui); margin-top: 3px; }
.model-settings { flex-shrink: 0; padding: 0 16px 8px; position: relative; text-align: right; }

.inquiry-panel-content { position: relative; min-height: 0; }

/* Compact browser-style category tabs. */

/* The reading list contains only deliberately added materials, not directories. */

.library-switcher { min-width: 0; flex: 1; position: relative; }

/* Functional controls stay neutral; shape and focus identify selection. */

/* A shared trailing action column keeps deletion out of the reading text. */

.category-delete-toggle:hover, .category-delete:hover, .category-delete-toggle[aria-pressed="true"] { background: var(--soft); color: var(--text); }

/* Reading detail: persistent navigation, one independently scrolling answer. */
.right-panel { overflow: hidden; }

@media(max-width:780px) {

}

/* Optional questions stay subordinate to the two direct reading actions. */

.selection-toolbar { width: min(440px, calc(100vw - 24px)); max-height: min(360px, calc(100vh - 24px)); overflow-y: auto; }
.selection-actions { flex-wrap: wrap; }

@media (max-width: 760px) { .selection-toolbar { left: 12px !important; transform: none; } .anchor-requests { padding: 10px 16px; } }
.anchor-requests button[title] { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; }

/* Selection actions become one focused field, rather than an expanded form. */
.selection-actions { grid-template-columns: repeat(3, minmax(0, 1fr)) 29px; }

.pdf-card-actions:has(.question-inline) > button { display: none; }

.question-composer.question-inline textarea { flex: 1; min-width: 0; width: 0; min-height: 32px; max-height: 120px; height: 32px; padding: 3px 0; margin: 0; border: 0; border-radius: 0; resize: none; background: transparent; box-shadow: none; outline: none; font-size: 16px; line-height: 26px; }

.question-inline:focus-within { border-color: var(--accent-muted); }

.selection-actions { grid-template-columns: 1fr 1fr 1.35fr auto; align-items: center; gap: 6px; padding: 7px; }

.selection-actions > .question-input-trigger:hover,

.question-trigger-arrow { display: flex; align-items: center; justify-content: center; flex: 0 0 23px; width: 23px; height: 23px; border-radius: 50%; background: var(--line); color: #fff; }

/* Recovery review: differences first, stable file columns. */

.library-title .library-open { width: 100%; text-align: left; }

.recovery-dialog { width: min(920px, calc(100vw - 48px)); max-height: calc(100dvh - 64px); padding: 0; overflow: hidden; color: var(--text); }
.recovery-dialog[open] { display: flex; flex-direction: column; }

.recovery-dialog button:hover { background: var(--panel); }

@media (max-width: 640px) {

}

/* A short decision, with details only when they can change the choice. */
.recovery-dialog { width: min(640px, calc(100vw - 48px)); }
.recovery-dialog h2 { font-size: 19px; }

.recovery-needed-details { margin-top: 18px; }

.recovery-footer > div { flex-direction: row-reverse; }
@media(max-width:640px) { .recovery-dialog { width: calc(100vw - 24px); } }
.model-controls .refresh-models { flex: 0 0 100%; border: 0; background: transparent; color: var(--accent); padding: 4px 0; text-align: left; font: inherit; font-size: var(--font-ui); cursor: pointer; }

/* The fixed top-band toggle sits outside the panel's scrolling content. */
.right-panel { position: relative; }
.panel-desktop-head { display: flex; align-items: center; flex-shrink: 0; min-height: 64px; padding: 8px; gap: 8px; border-bottom: 1px solid var(--line); }

}

}

/* One selection language for Markdown, PDF text and image regions. */
:root { --reading-selection:#9990ed70; }
.markdown-article::selection { background:var(--reading-selection); }
.selection-surface { container-type:inline-size; }
.pdf-selection-card:has(.question-inline) .selection-quote { display:none; }
.pdf-selection-card:has(.question-inline):focus-within { border-color:var(--accent-muted); }
@container (max-width:365px) {
 .selection-actions { grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; }
 .selection-actions > .question-input-trigger { grid-column:1 / -1; grid-row:2; }
 .selection-actions > .selection-close { grid-column:3; grid-row:1; }
}

.compact-actions > .question-composer { flex: 0 0 100%; margin: 0; }

.question-prompt { align-self: center; font-size: var(--font-ui-strong); color: var(--muted); }

/* Keep the preferred desktop width separate from temporary viewport constraints. */
@media (width > 780px) {
 .app-frame { --reader-left-space: 0px; --right-open-width: min(var(--preferred-right-width, 360px), max(220px, calc(100vw - var(--reader-left-space) - 320px))); --right-width: var(--right-open-width); }
 .panel-resize-handle { position:absolute; z-index:30; left:0; top:0; bottom:0; width:8px; cursor:col-resize; touch-action:none; }
 .panel-resize-handle::after { content:""; position:absolute; inset:0 auto 0 0; width:2px; background:transparent; }
 .panel-resize-handle:hover::after, .panel-resize-handle:focus-visible::after, .panel-resizing .panel-resize-handle::after { background:var(--accent-muted); }
 .panel-resize-handle:focus-visible { outline:2px solid var(--accent-muted); outline-offset:-2px; }
 .panel-resizing, .panel-resizing * { cursor:col-resize !important; user-select:none !important; }
}
@media (width > 1080px) { .app-frame { --reader-left-space:var(--left-width); } }
@media (max-width:780px) { .panel-resize-handle { display:none; } }
.compact-references { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:var(--font-ui); line-height:1.6; }
.compact-references a { color:var(--intent-violet); text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere; }
.explanation-sources .reference-limits { margin:8px 0 0; font-size:var(--font-ui); line-height:1.6; color:var(--muted); }

/* Keep metadata readable without crowding the filename or model controls. */
.toolbar-title .document-metadata { display: block; line-height: 1.5; }
.toolbar-title .reading-time { display: inline-block; margin-left: 3px; white-space: nowrap; }

.markdown-toolbar { background: var(--panel); flex: none; container-type: inline-size; position: relative; z-index: 16; border-bottom: 1px solid var(--soft); }

.markdown-width-controls { flex: none; position: relative; color: var(--muted); }
.markdown-width-fields { display: flex; align-items: center; gap: 8px; padding: 2px 4px 2px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(251,251,248,.7); }
.markdown-width-label { flex: none; font-size: var(--font-meta); color: var(--muted); white-space: nowrap; }

.markdown-width-slider::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right,var(--accent) 0 var(--width-progress),var(--mark) var(--width-progress) 100%); }
.markdown-width-slider::-moz-range-track { height: 3px; border-radius: 3px; background: var(--mark); }

.markdown-width-slider::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border: 2px solid #fff; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px #7770df55,0 1px 3px #25204425; }
.markdown-width-slider::-moz-range-thumb { box-sizing: border-box; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; background: var(--accent); }
.markdown-width-slider:focus-visible { outline: 2px solid var(--accent-muted); outline-offset: 2px; border-radius: 4px; }
.markdown-width-value { display: flex; align-items: center; flex: none; height: 26px; width: 49px; font-size: var(--font-ui); font-variant-numeric: tabular-nums; border: 1px solid transparent; border-radius: 5px; background: var(--soft); }
.markdown-width-value:focus-within { border-color: var(--accent-muted); background: var(--paper); box-shadow: 0 0 0 2px #7770df16; }

.reading-adjustment .reading-adjustment-fields { display: grid; grid-template-columns: minmax(40px,1fr) auto auto; align-items: center; gap: 10px; position: absolute; right: 0; top: 42px; width: 260px; max-width: calc(100cqw - 24px); box-sizing: border-box; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: 0 6px 22px #24204220; }

/* Reader chrome shares the full viewport, including the native scrollbar gutter. */

@media (prefers-reduced-motion: reduce) { .category-delete.confirming { animation: none; } }
.selection-actions > .question-input-trigger, .pdf-card-actions > .question-input-trigger { justify-content: center; gap: 6px; color: var(--text); border: 0; background: var(--accent-soft); font-size: var(--font-ui-strong); font-weight: 500; }

@media (max-width: 780px) {

@media (max-width: 780px) {
 .reader-toolbar { min-height: 64px; height: auto; padding: 10px 12px; }

}

/* Static article import uses the same local reading surface and protected resources. */
.library-add-link { border: 1px solid var(--border, var(--line)); border-radius: 7px; padding: 5px 8px; background: var(--paper); color: inherit; font: inherit; cursor: pointer; white-space: nowrap; }

.library-add-actions { flex-wrap: wrap; }
.web-import-dialog { width: min(760px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); padding: 0; border: 1px solid var(--accent-line); border-radius: 14px; color: var(--reading-ink); background: var(--paper); box-shadow: 0 16px 70px #21193633; }

.web-import-form > div { display: flex; gap: 8px; }

.web-import-scope { margin: 12px 22px; color: var(--muted); font-size: var(--font-ui); line-height: 1.6; }
.web-import-dialog > .library-warning { margin: 12px 22px; }
.web-import-progress { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 12px 22px; font-size: var(--font-ui-strong); }
.web-import-result { margin: 16px 22px 0; }
.web-import-result h3 { margin: 0 0 8px; }

.web-import-source { overflow-wrap: anywhere; }
.web-import-missing { padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--paper); font-size: var(--font-ui-strong); }
.web-import-missing ul { margin: 6px 0; padding-left: 20px; }
.web-import-preview { width: 100%; margin: 16px 0 0; max-height: 42dvh; overflow: auto; padding: 16px; border: 1px solid var(--line); border-radius: 8px; }
.web-import-dialog footer { position: sticky; bottom: 0; background: var(--paper); z-index: 1; border-top: 1px solid var(--soft); margin-top: 18px; }
.web-import-dialog .web-import-confirm { background: var(--intent-violet); border-color: var(--intent-violet); color: #fff; }
/* Reader/UI paper shares the neutral theme; PDF canvases and in-place translation retain their original pixels. */
:root { --reading-paper: #fbfbf8; }
.reader-scroll:not(.reader-scroll--pdf), .right-panel-inner { background: var(--reading-paper); }
.markdown-article { font-size: 18px; line-height: 1.75; color: var(--reading-ink); }

.markdown-width-error { grid-column: 1 / -1; font-size: var(--font-ui); line-height: 1.5; color: var(--amber); }
@media(max-width:1260px) { .markdown-article[data-width-mode="recommended"] { width: min(100%,704px); } }
@media(max-width:560px) { .markdown-article { font-size:17px; line-height:1.75; padding:36px 24px 75px; } .markdown-article[data-width-mode="recommended"] { width:100%; } }

.web-static-image { max-width: 100%; height: auto; }
.web-source-state { padding: 8px 16px; color: var(--muted); font-size: var(--font-ui); overflow-wrap: anywhere; }
.web-source-state a { color: var(--intent-violet); }
@media (max-width: 600px) { .web-import-dialog header, .web-import-dialog footer { padding: 14px; } .web-import-form { padding: 14px 14px 0; } .web-import-scope, .web-import-progress, .web-import-result { margin-left: 14px; margin-right: 14px; } .web-import-form > div { flex-wrap: wrap; } .web-import-form input { flex-basis: 100%; } }

.library-add-menu { position: relative; }

/* A shared second header row keeps navigation, reading and notes aligned. */

.reader-tools { min-height: var(--reading-tools-height); }

fault','hover','active','disabled','live'];
const groupSelect=document.querySelector('#group');for(const group of groups){const o=document.createElement('option');o.value=group;o.textContent=group;groupSelect.append(o)}
function render(){const query=document.querySelector('#search').value.trim().toLowerCase(),category=groupSelect.value;const found=rows.filter(r=>(!category||r.group===category)&&(!query||(r.group+' '+r.name+' '+r.note).toLowerCase().includes(query)));document.querySelector('#stats').textContent=found.length+' / '+rows.length+' 个按钮样例';const root=document.querySelector('#catalog');root.replaceChildren();for(const group of groups){const items=found.filter(r=>r.group===group);if(!items.length)continue;const section=document.createElement('section');section.className='group';const title=document.createElement('h2');title.textContent=group;section.append(title);const matrix=document.createElement('div');matrix.className='matrix';const head=document.createElement('div');head.className='matrix-head';for(const text of ['按钮 / 用途',...labels]){const d=document.createElement('div');d.textContent=text;head.append(d)}matrix.append(head);for(const item of items){const row=document.createElement('div');row.className='sample-row';const name=document.createElement('div');name.className='row-title';name.textContent=item.name;if(item.note){const small=document.createElement('small');small.textContent=item.note;name.append(small)}row.append(name);states.forEach((state,index)=>{const cell=document.createElement('div');cell.className='cell'+(state==='live'?' live':'');const lab=document.createElement('span');lab.className='cell-label';lab.textContent=labels[index];cell.append(lab);const preview=document.createElement('div');preview.className='preview';preview.innerHTML=item.html;const target=preview.querySelector('button,summary,img[role=button],.translation-count');if(state==='disabled'&&target.tagName!=='BUTTON'){const na=document.createElement('span');na.className='na';na.textContent='不适用';cell.append(na)}else{if(state!=='live'){target.dataset.previewState=state;target.tabIndex=-1;if(state==='disabled')target.disabled=true}else{target.dataset.live='true';target.setAttribute('aria-label',item.name+'（视觉预览）')}cell.append(preview)}row.append(cell)});matrix.append(row)}section.append(matrix);root.append(section)}if(!found.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有匹配的按钮';root.append(empty)}}
document.querySelector('#search').addEventListener('input',render);groupSelect.addEventListener('change',render);let timer;document.querySelector('#catalog').addEventListener('click',e=>{const target=e.target.closest('button,summary,img[role=button]');if(!target)return;if(!target.dataset.live){e.preventDefault();return}if(target.tagName!=='SUMMARY')e.preventDefault();const tip=document.querySelector('#tip');tip.textContent='仅预览反馈，不执行实际操作';tip.hidden=false;clearTimeout(timer);timer=setTimeout(()=>tip.hidden=true,1400)});render();
